<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Monitoring Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1120;
            color: #e5e7eb;
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .status {
            background: #052e1b;
            border: 1px solid #16a34a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .status h2 {
            color: #4ade80;
            margin-bottom: 8px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 25px;
        }

        .card h3 {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .recent {
            margin-top: 25px;
        }

        .recent h2 {
            margin-bottom: 15px;
        }

        .event {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Security Monitoring Dashboard</h1>
        <p class="subtitle">
            Real-time database security monitoring system
        </p>

        <div class="status">
            <h2>● SYSTEM SECURE</h2>
            <p>Security monitoring service is currently active.</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>THREATS DETECTED</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>AI ANALYZED</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>SYSTEM STATUS</h3>
                <div class="number">ONLINE</div>
            </div>

        </div>

        <div class="recent">
            <h2>Recent Security Events</h2>

            <div class="event">
                No security events detected.
            </div>
        </div>

    </div>

</body>

</html>
